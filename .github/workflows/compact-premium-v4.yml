name: Compact premium UI v4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Apply compact premium UI v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare latest main
        run: git fetch origin main && git reset --hard origin/main
      - name: Overwrite compact premium UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''<style id="compact-premium-v4">
          .app{width:min(1040px,100%);padding:10px 10px 92px}.top{gap:8px;margin-bottom:9px}.brand{font-size:20px}.status{font-size:9px;margin-top:3px}.balances{gap:5px}.pill{padding:6px 8px;border-radius:11px}.pill b{font-size:12px}.plus{width:19px;height:19px;border-radius:6px}.hero{padding:16px;border-radius:18px}.hero h1{font-size:clamp(24px,4vw,36px);margin:6px 0}.hero p{font-size:12px;line-height:1.45}.actions{gap:6px;margin-top:11px}.btn{padding:8px 11px;border-radius:10px;font-size:11px}.section-head{margin:11px 1px 7px}.section-head h2{font-size:16px}.section-head p{font-size:10px}.grid{gap:8px}.card{padding:11px;border-radius:14px;min-height:92px}.ico{width:36px;height:36px;border-radius:11px;font-size:17px}.card h3{margin:7px 0 3px;font-size:13px}.card p{font-size:10px;line-height:1.35}.characters{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}.char{border-radius:14px;min-width:0}.char img{height:138px}.charbody{padding:9px}.charname b{font-size:12px}.badge{font-size:8px;padding:3px 5px}.char p{font-size:9px;line-height:1.35;margin:5px 0;min-height:29px}.char .btn{padding:7px 8px;font-size:10px;border-radius:9px}.history-layout{display:grid!important;grid-template-columns:1fr!important;gap:8px!important}.side{display:block!important;width:100%!important;padding:9px!important;border-radius:15px!important}.historybox{min-height:470px;border-radius:15px}.historyhead{padding:10px 11px;background:linear-gradient(135deg,rgba(17,20,39,.86),rgba(27,18,54,.9));border:1px solid rgba(232,207,138,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.historyhead b{font-size:13px;background:linear-gradient(90deg,#f4f6ff,#cbb9ff,#e8cf8a);-webkit-background-clip:text;color:transparent}.historyhead small{font-size:9px;color:#bbaedc}.historymessages{padding:10px;gap:7px}.msg{max-width:88%;padding:8px 10px;font-size:11px;border-radius:12px}.telegrambar{padding:8px}.telegrambar .btn{padding:8px;font-size:10px}#historyControls{padding:8px;margin-bottom:8px;border-radius:12px;background:rgba(11,15,29,.8);border-color:rgba(232,207,138,.17);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}#historyControls .hbtn{padding:7px 9px;border-radius:9px;font-size:9px}.hc-row{min-height:52px!important;padding:7px!important;border-radius:11px!important;background:rgba(17,24,46,.9)!important;border-color:#2d3b62!important}.hc-main b{font-size:11px!important}.hc-main small{font-size:8px!important}.hc-actions button{width:25px;height:25px;font-size:10px}.nav{width:min(640px,calc(100% - 18px));height:60px;padding:5px;bottom:8px;border-radius:18px}.nav button{font-size:8px}.nav span{font-size:16px;margin-bottom:1px}.bonus{width:60px;height:60px;right:10px}.bonus .gift{font-size:19px}.bonus .blabel{font-size:6px}@media(max-width:600px){.app{padding-left:8px;padding-right:8px}.grid{grid-template-columns:1fr 1fr;gap:7px}.characters{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px}.char img{height:126px}.charbody{padding:8px}.char p{min-height:26px}}@media(min-width:601px){.characters{grid-template-columns:repeat(3,minmax(0,1fr))}}.historymessages>.msg.ai:only-child{display:none!important}#characterDetailModal{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(3,5,12,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:1000;opacity:0;transition:opacity .22s ease}#characterDetailModal.open{display:flex;opacity:1}#characterDetailModal .cdm-panel{width:min(520px,100%);max-height:min(88vh,720px);overflow:auto;background:linear-gradient(180deg,rgba(17,20,39,.97),rgba(9,12,24,.99));border:1px solid rgba(232,207,138,.23);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -24px 70px rgba(0,0,0,.55),0 0 45px rgba(145,83,255,.13);transform:translateY(28px);transition:transform .28s cubic-bezier(.2,.8,.2,1);position:relative;padding:14px}#characterDetailModal.open .cdm-panel{transform:translateY(0)}#characterDetailModal .cdm-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:rgba(7,10,20,.72);color:#fff;font-size:19px;z-index:2}.cdm-hero{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:center;padding:4px 2px 10px}.cdm-hero img{width:112px;height:146px;object-fit:cover;border-radius:17px;border:1px solid rgba(232,207,138,.2);box-shadow:0 10px 35px rgba(0,0,0,.28)}.cdm-name{font-size:23px;font-weight:950;background:linear-gradient(90deg,#fff,#fff2b8,#c8a6ff);-webkit-background-clip:text;color:transparent;margin-bottom:5px}.cdm-chip{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:8px;color:#f2e7bc;border:1px solid rgba(232,207,138,.24);background:rgba(232,207,138,.06)}.cdm-section{padding:11px;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));border:1px solid rgba(255,255,255,.08);margin-top:8px}.cdm-section h4{margin:0 0 5px;font-size:11px;color:#fff2b8;letter-spacing:.5px}.cdm-section p{margin:0;color:#c7cee3;font-size:10px;line-height:1.55;white-space:pre-wrap}.cdm-chat{width:100%;margin-top:10px;padding:11px;border:1px solid rgba(232,207,138,.35);border-radius:12px;background:linear-gradient(135deg,#278dff,#6947df 60%,#9e71ff);color:#fff;font-size:12px;font-weight:950;box-shadow:0 10px 30px rgba(64,91,255,.22)}@media(max-width:600px){#characterDetailModal .cdm-panel{border-radius:20px 20px 0 0;padding:12px}.cdm-hero{grid-template-columns:92px 1fr}.cdm-hero img{width:92px;height:120px}.cdm-name{font-size:20px}}
          </style>'''
          modal=r'''<div id="characterDetailModal" aria-hidden="true"><div class="cdm-panel" role="dialog" aria-modal="true"><button class="cdm-close" id="cdmClose" type="button">×</button><div class="cdm-hero"><img id="cdmImage" alt=""><div><div class="cdm-name" id="cdmName">Character</div><span class="cdm-chip">AI Companion</span></div></div><div class="cdm-section"><h4>Personality</h4><p id="cdmPersonality">—</p></div><div class="cdm-section"><h4>Bio</h4><p id="cdmBio">—</p></div><button class="cdm-chat" id="cdmChat" type="button">💬 Chat with this Character</button></div></div>'''
          js=r'''<script id="compact-premium-v4-js">(()=>{const M=document.getElementById('characterDetailModal');if(!M)return;const URL='https://hcbajvladlvhklelbxdr.supabase.co',KEY='sb_publishable_eKKXyB0rc7QUwTbdi8Xw_t0n27eIj',db2=supabase.createClient(URL,KEY);const img=M.querySelector('#cdmImage'),name=M.querySelector('#cdmName'),pers=M.querySelector('#cdmPersonality'),bio=M.querySelector('#cdmBio'),chat=M.querySelector('#cdmChat'),close=M.querySelector('#cdmClose');let chosenCard=null;function openModal(c,card){chosenCard=card;img.src=c.image_url||('https://api.dicebear.com/9.x/adventurer/svg?seed='+encodeURIComponent(c.name||'Character'));name.textContent=c.name||'Character';pers.textContent=c.personality||c.speaking_style||'Warm, engaging and private companion.';bio.textContent=c.description||c.backstory||c.scenario||'A private AI companion ready to talk with you.';M.classList.add('open');M.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}function shut(){M.classList.remove('open');M.setAttribute('aria-hidden','true');document.body.style.overflow=''}close.onclick=shut;M.addEventListener('click',e=>{if(e.target===M)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});chat.onclick=()=>{const b=chosenCard?.querySelector('.choose');shut();if(b)b.click()};const grid=document.getElementById('characterGrid');if(grid){const bind=()=>grid.querySelectorAll('.char').forEach(card=>{if(card.dataset.pv4)return;card.dataset.pv4='1';const b=card.querySelector('.choose');if(!b)return;card.addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();const q=await db2.from('characters').select('id,name,image_url,description,personality,backstory,speaking_style,scenario').eq('id',b.dataset.id).maybeSingle();if(q.data)openModal(q.data,card)},true)});new MutationObserver(bind).observe(grid,{childList:true,subtree:true});bind()}document.querySelectorAll('.historymessages .msg.ai').forEach(x=>{if((x.textContent||'').toLowerCase().includes('choose a conversation'))x.remove()})})();</script>'''
          # strip old premium layers but keep the rest of the app untouched
          s=re.sub(r'<style id="compact-premium-v[234]">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<script id="compact-premium-v[234]-js">.*?</script>','',s,flags=re.S)
          s=re.sub(r'<div id="characterDetailModal".*?</div></div>','',s,count=1,flags=re.S) if 'id="characterDetailModal"' in s else s
          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('</body>',modal+'\n'+js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply compact premium UI v4'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

name: Final UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final UI override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="ruby-final-ui-fix">
          :root{--pink:#ff6fae;--pink2:#ff9dca;--lav:#a98cff;--rose:#7d5470;--muted:#9b7f91;--glass:rgba(255,255,255,.60);--line:rgba(255,255,255,.78)}
          html,body{background:radial-gradient(circle at 18% 0%,#ffe0ef 0%,#f6eaff 34%,#eef8ff 72%,#fff8fc 100%)!important;color:#744e65!important}
          .hero,.panel,.card,.historybox,.side,.package,.memory,.setting,.pill,.bpanel,.char,.historyhead,.telegrambar{background:var(--glass)!important;border:1px solid var(--line)!important;backdrop-filter:blur(16px)!important;-webkit-backdrop-filter:blur(16px)!important;box-shadow:0 14px 35px rgba(184,104,147,.12)!important}
          .brand,.hero h1,.section-head h2,.cdm-name{background:linear-gradient(90deg,#ff4f9c,#9b73ff,#ff8ab9)!important;-webkit-background-clip:text!important;color:transparent!important}
          .app{padding-bottom:96px!important}.grid,.characters{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.char{border-radius:18px!important}.char img{height:128px!important}.charbody{padding:8px!important}.char .btn,.btn{border-radius:999px!important}.primary{background:linear-gradient(135deg,#ff70ad,#aa82ff)!important;color:#fff!important;border:0!important}
          .nav{bottom:20px!important;height:58px!important;border-radius:22px!important;background:rgba(255,245,251,.76)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important;box-shadow:0 18px 40px rgba(190,105,151,.18)!important;transition:bottom .3s cubic-bezier(.22,.61,.36,1),opacity .3s ease!important}.nav.ruby-nav-hidden{bottom:-100px!important;opacity:0!important}
          .bonus{z-index:6000!important;pointer-events:auto!important;cursor:pointer!important;border-radius:50%!important;background:radial-gradient(circle at 32% 25%,#fff7fb,#ffd2e6 36%,#d8c3ff 72%,#f8e8ff)!important;color:#9b4e78!important;box-shadow:0 16px 32px rgba(201,108,155,.18),0 0 26px rgba(255,111,174,.13)!important}.bonus.disabled{opacity:1!important;filter:none!important}
          .bpanel{display:none!important;pointer-events:none!important;z-index:6001!important}.bpanel.open{display:block!important;pointer-events:auto!important}
          .hc-modal{position:fixed!important;inset:0!important;display:none!important;align-items:center!important;justify-content:center!important;padding:18px!important;background:rgba(111,57,90,.22)!important;backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important;z-index:7000!important;pointer-events:none!important}.hc-modal.open{display:flex!important;pointer-events:auto!important}.hc-card{width:min(340px,calc(100vw - 32px))!important;padding:16px!important;border:1px solid rgba(255,255,255,.9)!important;border-radius:20px!important;background:rgba(255,247,252,.94)!important;box-shadow:0 28px 70px rgba(128,65,101,.24)!important;color:#714e65!important}.hc-card h3{color:#9e4f79!important}.hc-card p{color:#947488!important}.hc-card .danger{background:linear-gradient(135deg,#ff78b2,#b083ff)!important;color:#fff!important;border:0!important;border-radius:999px!important}
          </style>'''
          js='''<script id="ruby-final-ui-js">(()=>{let last=scrollY;addEventListener("scroll",()=>{const n=scrollY,v=document.querySelector(".nav");if(v&&Math.abs(n-last)>4)v.classList.toggle("ruby-nav-hidden",n>last&&n>20);last=n},{passive:true});const b=document.getElementById("bonus");const p=document.getElementById("bpanel");if(b&&p&&!b.dataset.finalBound){b.dataset.finalBound="1";b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();p.classList.toggle("open")})}})();</script>'''
          if 'id="ruby-final-ui-fix"' not in s:s=s.replace('</head>',css+'\n</head>',1)
          if 'id="ruby-final-ui-js"' not in s:s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply final cute UI and bonus modal fixes' || exit 0
          git push origin HEAD:main

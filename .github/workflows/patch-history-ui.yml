name: Patch RubyChan history UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply history management UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- RUBY_HISTORY_UI_V1 -->'
          if marker in s:
              raise SystemExit('history UI already patched')
          css=r'''
          <style>
          #historyControls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 10px;padding:10px;border:1px solid #293451;border-radius:15px;background:#0d1222}
          #historyControls .hbtn{border:1px solid #2d3b62;border-radius:10px;padding:8px 11px;background:#121a31;color:#fff;font-weight:850;font-size:10px}
          #historyControls .hbtn.danger{border-color:#6b3445;background:#2b1520}
          #historyControls .hint{color:#8e99b9;font-size:10px;margin-left:auto}
          .hc-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid transparent;border-radius:13px}
          .hc-row:hover{background:#11182e;border-color:#27365e}
          .hc-row.pinned{background:#111a34;border-color:#30416f}
          .hc-check{display:none;width:16px;height:16px;accent-color:#4cc9ff}
          body.hc-selecting .hc-check{display:block}
          .hc-main{min-width:0;border:0;background:transparent;color:#fff;text-align:left;cursor:pointer;padding:3px;width:100%}
          .hc-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
          .hc-main small{display:block;color:#8f9aba;font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .hc-actions{display:flex;gap:4px;align-items:center}
          .hc-actions button{border:1px solid #2d3b62;border-radius:8px;background:#11182e;color:#c8d4f4;width:27px;height:27px;font-size:11px}
          .hc-actions button.danger{color:#ff9cac;border-color:#633344}
          .hc-exp{color:#86dfff}
          .hc-empty{padding:12px;color:#8e99b9;font-size:10px}
          .hc-modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:200}
          .hc-modal.open{display:flex}
          .hc-card{width:min(340px,calc(100vw - 30px));padding:17px;border:1px solid #35456d;border-radius:18px;background:#0c1122;box-shadow:0 30px 70px #000c}
          .hc-card h3{margin:0 0 7px;font-size:15px}.hc-card p{color:#9da6c5;font-size:11px;line-height:1.55}.hc-card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}
          </style>
          '''
          html=r'''
          <div id="historyControls" style="display:none"><button class="hbtn" id="hcSelect">Select</button><button class="hbtn" id="hcAll" style="display:none">Select All</button><button class="hbtn danger" id="hcDelete" style="display:none">Delete</button><span class="hint" id="hcHint">Unpinned chats auto-delete 7 days after creation.</span></div>
          <div class="hc-modal" id="hcModal"><div class="hc-card"><h3>Delete chat?</h3><p>This permanently deletes the conversation and all of its messages. This cannot be undone.</p><div class="row"><button class="hbtn" id="hcCancel">Cancel</button><button class="hbtn danger" id="hcConfirm">Delete</button></div></div></div>
          '''
          js=r'''
          <script>
          <!-- RUBY_HISTORY_UI_V1 -->
          (()=>{
            const URL='https://hcbajvladlvhklelbxdr.supabase.co',KEY='sb_publishable_eKKXyB0rc7QUwTbbydi8Xw_t0n27eIj';
            const db=supabase.createClient(URL,KEY), tg=window.Telegram?.WebApp||null;
            let uid=null, rows=[], selected=new Set(), selecting=false, pendingDelete=[];
            const $=id=>document.getElementById(id);
            const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
            const chatId=()=>String(tg?.initDataUnsafe?.user?.id||new URLSearchParams(location.search).get('telegram_chat_id')||'');
            async function auth(){if(uid)return uid;const u=await db.auth.getUser();uid=u.data.user?.id||null;return uid}
            function daysLeft(dt){const ms=new Date(dt).getTime()-Date.now();return Math.max(0,Math.ceil(ms/86400000))}
            function openBot(){const u='https://t.me/Rubby_Chan_Bot';if(tg?.openTelegramLink)tg.openTelegramLink(u);else window.open(u,'_blank')}
            async function cleanup(){await db.rpc('cleanup_expired_conversations')}
            async function loadHC(){
              if(!(await auth()))return;
              await cleanup();
              const r=await db.from('conversations').select('id,character_id,title,created_at,updated_at,is_pinned,pin_position,expires_at').eq('user_id',uid).eq('source','telegram').order('is_pinned',{ascending:false}).order('pin_position',{ascending:true,nullsFirst:false}).order('created_at',{ascending:false}).limit(100);
              if(r.error)return;
              rows=r.data||[];
              const ids=[...new Set(rows.map(x=>x.character_id))];
              let chars=[];if(ids.length){const q=await db.from('characters').select('id,name,image_url').in('id',ids);chars=q.data||[]}
              const cm=new Map(chars.map(c=>[c.id,c]));
              const host=$('conversationList');
              host.innerHTML=rows.length?rows.map((c,i)=>{
                const ch=cm.get(c.character_id)||{};const label=c.is_pinned?'📌 Pinned':(c.expires_at?`Auto-deletes in ${daysLeft(c.expires_at)} day${daysLeft(c.expires_at)==1?'':'s'}`:'');
                const pin=!!c.is_pinned;return `<div class="hc-row ${pin?'pinned':''}" data-cid="${esc(c.id)}"><input class="hc-check" type="checkbox" ${selected.has(c.id)?'checked':''}><button class="hc-main" type="button"><b>${esc(c.title||`${ch.name||'Chat'} Chat`)}</b><small>${esc(ch.name||'Character')} · <span class="hc-exp">${esc(label)}</span></small></button><div class="hc-actions">${pin?`<button data-action="up" title="Move up">↑</button><button data-action="down" title="Move down">↓</button><button data-action="unpin" title="Unpin">📌</button>`:`<button data-action="pin" title="Pin">📌</button>`}<button class="danger" data-action="delete" title="Delete">🗑</button></div></div>`;
              }).join(''):'<div class="hc-empty">No Telegram conversations yet.</div>';
              $('historyControls').style.display='flex';
              syncToolbar();
              host.querySelectorAll('.hc-row').forEach(bindRow);
            }
            function syncToolbar(){ $('hcSelect').textContent=selecting?'Done':'Select'; $('hcAll').style.display=selecting?'inline-block':'none';$('hcDelete').style.display=selecting?'inline-block':'none';$('hcDelete').textContent=selected.size?`Delete (${selected.size})`:'Delete';document.body.classList.toggle('hc-selecting',selecting); }
            function bindRow(row){
              const id=row.dataset.cid;
              row.querySelector('.hc-main').addEventListener('click',async()=>{if(selecting){const cb=row.querySelector('.hc-check');cb.checked=!cb.checked;cb.checked?selected.add(id):selected.delete(id);syncToolbar();return}await resume(id)});
              row.querySelector('.hc-check').addEventListener('click',e=>{e.stopPropagation();e.currentTarget.checked?selected.add(id):selected.delete(id);syncToolbar()});
              row.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async e=>{e.stopPropagation();await action(b.dataset.action,id)}));
            }
            async function action(a,id){
              if(a==='delete'){pendingDelete=[id];$('hcModal').classList.add('open');return}
              if(a==='pin'){const r=await db.rpc('pin_conversation',{p_user_id:uid,p_conversation_id:id});if(r.error){toastHC(r.error.message)}else await loadHC();return}
              if(a==='unpin'){const r=await db.rpc('unpin_conversation',{p_user_id:uid,p_conversation_id:id});if(r.error)toastHC(r.error.message);await loadHC();return}
              if(a==='up'||a==='down'){
                const pins=rows.filter(x=>x.is_pinned).sort((x,y)=>(x.pin_position||0)-(y.pin_position||0));const at=pins.findIndex(x=>x.id===id);const to=a==='up'?at-1:at+1;if(at<0||to<0||to>=pins.length)return;[pins[at],pins[to]]=[pins[to],pins[at]];const r=await db.rpc('reorder_pinned_conversations',{p_user_id:uid,p_order:pins.map(x=>x.id)});if(r.error)toastHC(r.error.message);await loadHC();
              }
            }
            async function resume(id){
              const c=rows.find(x=>x.id===id);if(!c)return;const r=await db.rpc('set_telegram_conversation',{p_user_id:uid,p_telegram_chat_id:chatId(),p_conversation_id:id});if(r.error){toastHC(r.error.message);return}const q=await db.from('characters').select('name,image_url').eq('id',c.character_id).maybeSingle();$('chatName').textContent=q.data?.name||c.title||'Conversation';$('chatAvatar').src=q.data?.image_url||$('chatAvatar').src;const m=await db.from('messages').select('role,content,created_at').eq('conversation_id',id).eq('user_id',uid).order('created_at');$('historyMessages').innerHTML=(m.data||[]).map(x=>`<div class="msg ${x.role==='user'?'user':'ai'}">${esc(x.content)}</div>`).join('')||'<div class="msg ai">No messages yet.</div>';openBot()}
            function toastHC(t){let x=document.getElementById('toast');if(!x)return; x.textContent=String(t);x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}
            $('hcSelect').addEventListener('click',()=>{selecting=!selecting;if(!selecting)selected.clear();syncToolbar()});
            $('hcAll').addEventListener('click',()=>{if(selected.size===rows.length)selected.clear();else rows.forEach(x=>selected.add(x.id));loadHC()});
            $('hcDelete').addEventListener('click',()=>{if(!selected.size){toastHC('Select at least one chat.');return}pendingDelete=[...selected];$('hcModal').classList.add('open')});
            $('hcCancel').addEventListener('click',()=>{$('hcModal').classList.remove('open');pendingDelete=[]});
            $('hcConfirm').addEventListener('click',async()=>{for(const id of pendingDelete){const r=await db.rpc('delete_conversation_hard',{p_user_id:uid,p_conversation_id:id});if(r.error)toastHC(r.error.message)}pendingDelete=[];selected.clear();$('hcModal').classList.remove('open');selecting=false;syncToolbar();await loadHC()});
            // Existing Character action now represents a fresh chat. Backend v5 creates a new conversation for each selection.
            const labeler=new MutationObserver(()=>document.querySelectorAll('.choose').forEach(b=>{if(b.textContent.trim()==='Choose Character')b.textContent='New Chat'}));labeler.observe(document.body,{subtree:true,childList:true});
            const originalShow=window.switchPage;
            document.querySelectorAll('#navChat,#homeHistory,#cardHistory').forEach(el=>el.addEventListener('click',()=>setTimeout(loadHC,80),true));
            const watcher=new MutationObserver(()=>{if(document.getElementById('chat')?.classList.contains('active'))loadHC()});watcher.observe(document.getElementById('chat'),{attributes:true,attributeFilter:['class']});
            loadHC();
          })();
          </script>
          '''
          if '<section id="chat" class="view"><div class="history-layout">' not in s:
              raise SystemExit('chat marker not found')
          s=s.replace('<section id="chat" class="view"><div class="history-layout">','<section id="chat" class="view"><div id="historyControls" style="display:none"><button class="hbtn" id="hcSelect">Select</button><button class="hbtn" id="hcAll" style="display:none">Select All</button><button class="hbtn danger" id="hcDelete" style="display:none">Delete</button><span class="hint" id="hcHint">Unpinned chats auto-delete 7 days after creation.</span></div><div class="history-layout">',1)
          s=s.replace('</style>',css.replace('<style>','').replace('</style>','')+'</style>',1)
          s=s.replace('</body>',html+js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply history management UI patch'
          git push

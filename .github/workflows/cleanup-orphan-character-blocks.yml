name: Clean orphan character modal blocks
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean duplicate modal markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          modal_start = s.find('<div id="characterDetailModal"')
          if modal_start == -1:
              raise SystemExit('characterDetailModal not found')
          modal_end = s.find('<script', modal_start)
          if modal_end == -1:
              raise SystemExit('modal script boundary not found')

          before = s[:modal_start]
          modal = s[modal_start:modal_end]
          after = s[modal_end:]

          # Remove every orphan Personality/Bio section and Chat CTA outside the modal.
          orphan_section = re.compile(r'\s*<div class="cdm-section">\s*<h4>(?:Personality|Bio)</h4>.*?</div>', re.S)
          orphan_chat = re.compile(r'\s*<button class="cdm-chat"[^>]*>.*?</button>', re.S)
          before = orphan_section.sub('', before)
          before = orphan_chat.sub('', before)
          after = orphan_section.sub('', after)
          after = orphan_chat.sub('', after)

          # Inside the modal keep exactly one Personality section; remove Bio entirely.
          modal = re.sub(r'\s*<div class="cdm-section">\s*<h4>Bio</h4>.*?</div>', '', modal, flags=re.S)
          person = re.compile(r'\s*<div class="cdm-section">\s*<h4>Personality</h4>.*?</div>', re.S)
          matches = list(person.finditer(modal))
          if len(matches) > 1:
              keep = matches[0].group(0)
              modal = person.sub('', modal)
              insert_at = modal.find('</div>')
              if insert_at != -1:
                  insert_at += len('</div>')
                  modal = modal[:insert_at] + keep + modal[insert_at:]

          # Ensure a single Chat CTA remains in the modal.
          chats = list(orphan_chat.finditer(modal))
          if len(chats) > 1:
              first = chats[0].group(0)
              modal = orphan_chat.sub('', modal)
              insert_at = modal.rfind('</div>')
              modal = modal[:insert_at] + first + modal[insert_at:]

          s2 = before + modal + after
          p.write_text(s2, encoding='utf-8')
          PY

          # Basic guard checks.
          test -s index.html
          grep -q 'id="characterDetailModal"' index.html
          test "$(grep -o 'id="characterDetailModal"' index.html | wc -l)" -eq 1
          test "$(grep -o 'class="cdm-chat"' index.html | wc -l)" -eq 1
          test "$(grep -o '<h4>Bio</h4>' index.html | wc -l)" -eq 0 || true

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clean duplicate character modal markup' || exit 0
          git push origin HEAD:main

name: Final history and nav fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix History and Memory references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove unwanted History header subtitle and Telegram CTA.
          s=s.replace('<small id="chatMood">Premium Telegram history</small>','')
          s=re.sub(r'<div class="telegrambar">\s*<button[^>]*id="openTelegramChat"[^>]*>Open Telegram to Chat</button>\s*</div>','',s,flags=re.S)
          s=s.replace('<aside class="side"><h3>Chat History</h3><div id="conversationList">','<aside class="side"><div id="conversationList">')
          s=s.replace('<b id="chatName">Chat History</b>','<b id="chatName"></b>')

          # Remove the remaining Memory navigation item.
          s=re.sub(r'<button[^>]*id="navMemory"[^>]*>.*?</button>','',s,flags=re.S)

          # Remove Memory from JS view/navigation logic so no null-element error stops the script.
          s=s.replace("const views=['home','characters','chat','memory','recharge','settings'];","const views=['home','characters','chat','recharge','settings'];")
          s=s.replace(",memory:'navMemory'","")
          s=s.replace("if(n==='memory')loadMemories();","")
          s=s.replace("nav('navMemory','memory');","")
          s=re.sub(r"\$\('cardMemory'\)\.addEventListener\('click',\(\)=>show\('memory'\)\);",'',s)

          # The Memory page itself is gone; keep unused memory helpers inert but remove any direct DOM startup call.
          s=s.replace("loadMemories();","")

          # Make active bottom-nav state robust after tab removal.
          fix='''<script id="nav-active-fix">(()=>{document.querySelectorAll('.nav button').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')})})})();</script>'''
          if 'id="nav-active-fix"' not in s:
              s=s.replace('</body>',fix+'\n</body>')

          p.write_text(s,encoding='utf-8')
          PY
          test -s index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix History UI and remove remaining Memory references' || exit 0
          git push origin HEAD:main

name: Import character images through proxy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download via image proxy
        run: |
          set -e
          mkdir -p assets/characters
          curl -L --fail --retry 2 'https://images.weserv.nl/?url=i.pinimg.com/564x/ab/4f/c7/ab4fc790bddb89dc9b006e1e4a9c3e2.jpg' -o assets/characters/yuna.jpg
          curl -L --fail --retry 2 'https://images.weserv.nl/?url=media.easy-peasy.ai/27feb2bb-aeb4-4a83-9fb6-8f3f2a15885e/59b1c9a8-392b-4d9a-84d0-f075091ffa1b.png' -o assets/characters/rin.png
          curl -L --fail --retry 2 'https://images.weserv.nl/?url=i-blog.csdnimg.cn/blog_migrate/332cc1a83679e50899b6045e2bb3cece.png' -o assets/characters/akari.png
          curl -L --fail --retry 2 'https://images.weserv.nl/?url=c-ssl.duitang.com/uploads/blog/202306/14/Q2SDz364f8YX0jM.jpg' -o assets/characters/hana.jpg
          curl -L --fail --retry 2 'https://images.weserv.nl/?url=c-ssl.duitang.com/uploads/blog/202305/01/20230501125015_95235.jpg' -o assets/characters/reina.jpg
          curl -L --fail --retry 2 'https://images.weserv.nl/?url=i.pinimg.com/originals/bf/ef/23/bfef23375344609c048165a7e7ae150b.jpg' -o assets/characters/sakura.jpg
          file assets/characters/*
          git add assets/characters
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import character images as local assets'
          git push origin HEAD:main

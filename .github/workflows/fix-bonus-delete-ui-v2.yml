name: Fix bonus and delete UI v2
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final UI safety overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''<style id="ruby-ui-safety-fix">
          .bonus{z-index:6000!important;pointer-events:auto!important;cursor:pointer!important}
          .bpanel{display:none!important;pointer-events:none!important;z-index:6001!important}
          .bpanel.open{display:block!important;pointer-events:auto!important}
          .hc-modal{display:none!important;pointer-events:none!important;z-index:7000!important}
          .hc-modal.open{display:flex!important;pointer-events:auto!important}
          #hcModal{display:none!important}
          #hcModal.open{display:flex!important}
          </style>'''
          if 'id="ruby-ui-safety-fix"' in s:
              raise SystemExit(0)
          if '</head>' not in s:
              raise SystemExit('head closing tag not found')
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix bonus button interaction and hide delete modal' || exit 0
          git push origin HEAD:main

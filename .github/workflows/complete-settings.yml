name: Complete Settings and Legal Pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild settings section and legal modals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          settings = '''<section id="settings" class="view">
            <div class="section-head"><div><h2>Settings</h2><p>Account, app, safety and legal</p></div></div>
            <div class="panel">
              <div class="section-head"><div><h2>Account & Plan</h2><p>Your Ruby Chan account</p></div></div>
              <div class="settings-grid">
                <div class="setting"><b>Current Plan</b><p class="status">Free</p><button class="btn primary" id="settingsRecharge" type="button">Upgrade / Recharge</button></div>
                <div class="setting"><b>Account Status</b><p class="status">Connected account</p><button class="btn ghost" id="settingsRefresh" type="button">Refresh account</button></div>
              </div>
            </div>
            <div class="panel" style="margin-top:10px">
              <div class="section-head"><div><h2>Appearance & Notifications</h2><p>Control the app experience</p></div></div>
              <div class="settings-grid">
                <div class="setting"><label>Language<select id="language" class="select" style="max-width:160px"><option value="en">English</option><option value="my">မြန်မာ</option></select></label></div>
                <div class="setting"><label>Background<select id="bgmode" class="select" style="max-width:160px"><option value="midnight">Midnight</option><option value="pink">Cute Pink</option><option value="lavender">Lavender</option></select></label></div>
                <div class="setting"><label>Notifications<button id="notif" class="switch on" type="button"><i></i></button></label><small class="status">Important account and app updates</small></div>
                <div class="setting"><label>Offers & Promotions<button id="offers" class="switch on" type="button"><i></i></button></label><small class="status">Optional promotional messages</small></div>
              </div>
              <div class="actions"><button id="saveSettings" class="btn primary" type="button">Save settings</button></div>
            </div>
            <div class="panel" style="margin-top:10px">
              <div class="section-head"><div><h2>History & Safety</h2><p>Keep your conversations and account safer</p></div></div>
              <div class="settings-grid">
                <div class="setting"><b>Auto-delete</b><p class="status">Unpinned conversations are removed 7 days after creation.</p></div>
                <div class="setting"><b>Telegram Sync</b><p class="status">Conversation history is read-only inside the app.</p></div>
                <div class="setting"><b>Safety</b><p class="status">18+ adults only. Do not share passwords, payment codes or sensitive account credentials.</p></div>
                <div class="setting"><b>Age Gate</b><p class="status">By continuing, you confirm you are 18 years or older.</p></div>
              </div>
            </div>
            <div class="panel" style="margin-top:10px">
              <div class="section-head"><div><h2>Support & Legal</h2><p>Important information and help</p></div></div>
              <div class="settings-grid">
                <div class="setting"><button class="btn ghost legal-open" data-legal="support" type="button">🛟 Support & Feedback</button><p class="status">Help, bug reports and feedback</p></div>
                <div class="setting"><button class="btn ghost legal-open" data-legal="terms" type="button">📜 Terms & Conditions</button><p class="status">Rules for using Ruby Chan</p></div>
                <div class="setting"><button class="btn ghost legal-open" data-legal="privacy" type="button">🔒 Privacy Policy</button><p class="status">How your information is handled</p></div>
                <div class="setting"><button class="btn ghost legal-open" data-legal="18plus" type="button">🔞 18+ Policy</button><p class="status">Adults-only rules and restrictions</p></div>
                <div class="setting"><button class="btn ghost legal-open" data-legal="community" type="button">💗 Community Guidelines</button><p class="status">Respect, consent and prohibited behavior</p></div>
                <div class="setting"><button class="btn ghost legal-open" data-legal="safety" type="button">🛡️ Safety Center</button><p class="status">Account and conversation safety tips</p></div>
                <div class="setting"><button class="btn ghost legal-open" data-legal="about" type="button">ℹ️ About Ruby Chan</button><p class="status">App information and version</p></div>
              </div>
            </div>
          </section>'''

          s2,n=re.subn(r'<section id="settings" class="view">.*?</section>\s*<div class="nav"', settings+'\n<div class="nav"', s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit('settings section not found')
          s=s2

          modals='''<div id="legalModal" class="hc-modal"><div class="hc-card"><button class="close" id="legalClose" type="button" style="float:right">×</button><h3 id="legalTitle">Information</h3><div id="legalBody"></div></div></div>
          <style id="legal-settings-style">.legal-open{width:100%;text-align:left}.legal-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0f1428}.legal-card p{color:var(--muted);font-size:11px;line-height:1.6;margin:7px 0}.legal-card ul{margin:6px 0 0 17px;padding:0;color:var(--muted);font-size:11px;line-height:1.65}</style>
          <script id="legal-settings-script">(()=>{const M={support:['Support & Feedback','For support, bug reports, payment problems or product feedback, use the official Ruby Chan support contact provided by the app owner. Never send passwords, one-time codes or private payment credentials.'],terms:['Terms & Conditions','Ruby Chan is an AI companion service. You agree to use it lawfully, respect other people, and follow the service rules. Features, limits and pricing may change. Do not misuse the service, automate abuse, or attempt to bypass safety or payment controls.'],privacy:['Privacy Policy','The app may process account, session, device, Telegram, conversation and usage data needed to provide the service. Data should be used only for operating, securing and improving the service as configured by the app owner. Never share secrets or payment credentials with the AI.'],18plus:['18+ Policy','Ruby Chan is for adults aged 18 or older. Minors may not use the service. Sexual content involving minors, coercion, exploitation, trafficking or non-consensual sexual material is prohibited.'],community:['Community Guidelines','Be respectful. Do not harass, threaten, exploit or impersonate real people. Do not use the service for fraud, abuse, or non-consensual sexual content. Respect consent and applicable laws.'],safety:['Safety Center','Keep your Telegram account, passwords and payment codes private. Use official app links, avoid suspicious requests, and report bugs or unsafe behavior through the official support channel.'],about:['About Ruby Chan','Ruby Chan is an AI companion app connected to Telegram. This screen contains app settings, safety information and legal notices.']};const q=id=>document.getElementById(id);function open(k){const v=M[k]||M.about;q('legalTitle').textContent=v[0];q('legalBody').innerHTML='<div class="legal-card"><p>'+v[1]+'</p></div>';q('legalModal').classList.add('open')}document.querySelectorAll('.legal-open').forEach(b=>b.addEventListener('click',()=>open(b.dataset.legal)));q('legalClose')?.addEventListener('click',()=>q('legalModal').classList.remove('open'));q('legalModal')?.addEventListener('click',e=>{if(e.target===q('legalModal'))q('legalModal').classList.remove('open')});q('settingsRecharge')?.addEventListener('click',()=>show('recharge'));q('settingsRefresh')?.addEventListener('click',async()=>{profile=null;await session();await prof();toast('Account refreshed')});})();</script>
          '''
          s=s.replace('</body>',modals+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I))
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); path=f.name
          r=subprocess.run(['node','--check',path],capture_output=True,text=True)
          print(r.stderr)
          sys.exit(r.returncode)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Expand settings with support and legal pages' || exit 0
          git push origin HEAD:main

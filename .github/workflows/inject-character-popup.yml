name: inject-character-popup
on:
  push:
    paths:
      - 'character-new-chat.js'
      - '.github/workflows/inject-character-popup.yml'
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject script tag once
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script id="ruby-character-new-chat" src="character-new-chat.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Missing </body> marker')
              s=s.replace(marker, tag+marker, 1)
              p.write_text(s)
          PY
      - name: Commit injected shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Wire character popup into web app [skip ci]'
          git push

name: Use local character art
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map character cards to local art
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          if 'id="local-character-art"' not in s:
              script='''<script id="local-character-art">(()=>{const map={Yuna:"assets/characters/yuna.svg",Rin:"assets/characters/rin.svg",Akari:"assets/characters/akari.svg",Hana:"assets/characters/hana.svg",Reina:"assets/characters/reina.svg",Sakura:"assets/characters/sakura.svg"};const apply=()=>document.querySelectorAll('#characterGrid img').forEach(img=>{const n=(img.alt||'').trim();if(map[n]){img.src=map[n];img.onerror=null;}});new MutationObserver(apply).observe(document.body,{subtree:true,childList:true});window.addEventListener('load',apply);setTimeout(apply,500);})();</script>'''
              s=s.replace(marker,script+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I))
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); path=f.name
          r=subprocess.run(['node','--check',path],capture_output=True,text=True)
          print(r.stderr)
          sys.exit(r.returncode)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use local character artwork assets' || exit 0
          git push origin HEAD:main

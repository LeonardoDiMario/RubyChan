name: Personality modal v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply personality modal v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update modal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Replace the current modal content with one unified personality section.
          s = re.sub(
              r'<div id="characterDetailModal"[^>]*>.*?</div></div>',
              '''<div id="characterDetailModal" aria-hidden="true"><div class="cdm-panel" role="dialog" aria-modal="true"><button class="cdm-close" id="cdmClose" type="button" aria-label="Close">×</button><div class="cdm-hero"><img id="cdmImage" alt=""><div><div class="cdm-name" id="cdmName">Character</div><span class="cdm-chip">AI Companion</span></div></div><div class="cdm-section cdm-personality"><h4>Personality</h4><p id="cdmPersonality">—</p></div><button class="cdm-chat" id="cdmChat" type="button">💬 Chat with this Character</button></div></div>''',
              s,
              count=1,
              flags=re.S,
          )

          # Ensure only the single Personality block is styled/rendered by this layer.
          css = '''
<style id="personality-modal-v2">
#characterDetailModal .cdm-panel{padding:14px!important}
#characterDetailModal .cdm-section{margin-top:8px;padding:12px;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.018));border:1px solid rgba(232,207,138,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
#characterDetailModal .cdm-section h4{margin:0 0 7px;font-size:11px;color:#fff2b8;letter-spacing:.6px;text-transform:uppercase}
#characterDetailModal .cdm-section p{margin:0;color:#d7dcef;font-size:10.5px;line-height:1.65;white-space:pre-wrap}
#characterDetailModal .cdm-personality{min-height:110px}
#characterDetailModal .cdm-chat{margin-top:10px}
</style>
'''
          s = re.sub(r'<style id="personality-modal-v2">.*?</style>\s*', '', s, flags=re.S)
          s = s.replace('</head>', css + '</head>', 1)

          # Replace old JS modal handler with a unified personality source.
          js = '''
<script id="personality-modal-v2-js">
(()=>{
  const M=document.getElementById('characterDetailModal');
  if(!M)return;
  const URL='https://hcbajvladlvhklelbxdr.supabase.co';
  const KEY='sb_publishable_eKKXyB0rc7QUwTbbydi8Xw_t0n27eIj';
  const db=supabase.createClient(URL,KEY);
  const img=document.getElementById('cdmImage'), name=document.getElementById('cdmName'), pers=document.getElementById('cdmPersonality'), chat=document.getElementById('cdmChat'), close=document.getElementById('cdmClose');
  let selectedBtn=null;
  function openModal(c,btn){
    selectedBtn=btn||null;
    img.src=c.image_url || ('https://api.dicebear.com/9.x/adventurer/svg?seed='+encodeURIComponent(c.name||'Character'));
    name.textContent=c.name||'Character';
    // One combined personality profile. No separate Bio section.
    const parts=[c.personality,c.description,c.backstory,c.scenario,c.speaking_style].filter(Boolean).map(v=>String(v).trim()).filter(Boolean);
    pers.textContent=parts.length ? [...new Set(parts)].join('\n\n') : 'A warm, engaging AI companion with a distinct personality and conversational style.';
    M.classList.add('open'); M.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
  }
  function shut(){M.classList.remove('open');M.setAttribute('aria-hidden','true');document.body.style.overflow='';}
  close.addEventListener('click',shut);
  M.addEventListener('click',e=>{if(e.target===M)shut()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
  chat.addEventListener('click',()=>{const b=selectedBtn;shut();if(b)b.click()});
  const grid=document.getElementById('characterGrid');
  if(grid){
    const bind=()=>grid.querySelectorAll('.char').forEach(card=>{
      if(card.dataset.personalityModalBound)return;
      card.dataset.personalityModalBound='1';
      const btn=card.querySelector('.choose'); if(!btn)return;
      card.addEventListener('click',async e=>{
        e.preventDefault(); e.stopPropagation();
        const id=btn.dataset.id; if(!id)return;
        const q=await db.from('characters').select('id,name,image_url,description,personality,backstory,speaking_style,scenario').eq('id',id).maybeSingle();
        if(q.data)openModal(q.data,btn);
      },true);
    });
    new MutationObserver(bind).observe(grid,{childList:true,subtree:true});
    bind();
  }
})();
</script>
'''
          s = re.sub(r'<script id="personality-modal-v2-js">.*?</script>\s*', '', s, flags=re.S)
          # Remove earlier compact modal JS so it cannot overwrite the unified content.
          s = re.sub(r'<script id="compact-premium-v2-js">.*?</script>\s*', '', s, flags=re.S)
          s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply personality modal v2'
          git pull --rebase origin main
          git push

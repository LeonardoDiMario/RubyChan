name: Fix character image loading
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add safe character image fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Add a reusable safe image fallback before loadCharacters.
          marker = "async function loadCharacters()"
          helper = """function charFallback(name){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns=\\"http://www.w3.org/2000/svg\\" viewBox=\\"0 0 600 760\\"><defs><linearGradient id=\\"g\\" x1=\\"0\\" x2=\\"1\\" y1=\\"0\\" y2=\\"1\\"><stop stop-color=\\"#ffd6ea\\"/><stop offset=\\"1\\" stop-color=\\"#d8c9ff\\"/></linearGradient></defs><rect width=\\"600\\" height=\\"760\\" rx=\\"42\\" fill=\\"url(#g)\\"/><circle cx=\\"300\\" cy=\\"275\\" r=\\"118\\" fill=\\"#fff\\" fill-opacity=\\".82\\"/><circle cx=\\"255\\" cy=\\"260\\" r=\\"12\\" fill=\\"#7d5372\\"/><circle cx=\\"345\\" cy=\\"260\\" r=\\"12\\" fill=\\"#7d5372\\"/><path d=\\"M245 325 Q300 365 355 325\\" fill=\\"none\\" stroke=\\"#9b5f82\\" stroke-width=\\"10\\" stroke-linecap=\\"round\\"/><text x=\\"300\\" y=\\"555\\" text-anchor=\\"middle\\" font-family=\\"Arial,sans-serif\\" font-size=\\"34\\" font-weight=\\"700\\" fill=\\"#7d5372\\">'+esc(name||'Character')+'</text></svg>')};\n"""
          if marker in s and 'function charFallback(name)' not in s:
              s = s.replace(marker, helper + marker, 1)

          # Make image rendering robust: every broken/blocked URL falls back to a local SVG.
          pattern = r'<img src=\\"\\$\\{esc\\(c\\.image_url\\|\\|\\'https://api\\.dicebear\\.com/9\\.x/adventurer/svg\\?seed=\\'\\+encodeURIComponent\\(c\\.name\\)\\)\\}\\" alt=\\"\\">'
          repl = '<img src="${esc(c.image_url||charFallback(c.name))}" alt="${esc(c.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=charFallback(this.alt)">'
          s2, n = re.subn(pattern, repl, s, count=1)
          if n == 0:
              # Fallback replacement for the common current expression.
              s2, n = re.subn(r'<img src="\$\{esc\(c\.image_url\|\|\'https://api\.dicebear\.com/9\.x/adventurer/svg\?seed=\'\+encodeURIComponent\(c\.name\)\)\}" alt="">', repl, s, count=1)
          if n == 0:
              raise SystemExit('Character image template not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s = Path('index.html').read_text(encoding='utf-8')
          js = '\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s, re.I))
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); path=f.name
          r = subprocess.run(['node','--check',path],capture_output=True,text=True)
          print(r.stdout); print(r.stderr)
          sys.exit(r.returncode)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix character image loading and fallback' || exit 0
          git push origin HEAD:main

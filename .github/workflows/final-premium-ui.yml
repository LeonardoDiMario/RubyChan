name: Final Premium UI Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply final premium UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final premium UI
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
<style id="ruby-final-premium-ui">
:root{
  --rp-bg:#0b0c10; --rp-bg2:#111326; --rp-glass:rgba(255,255,255,.035);
  --rp-border:rgba(255,255,255,.08); --rp-text:#f7f8ff; --rp-muted:#9da6c5;
  --rp-purple:#9b6cff; --rp-cyan:#4cc9ff; --rp-gold:#e8cf8a; --rp-gold2:#fff2b8;
}
html,body{background:radial-gradient(circle at 15% 0%,#181632 0%,#0b0c10 45%,#07080d 100%)!important;color:var(--rp-text)!important}
body{min-height:100%;overflow-x:hidden}
.app{width:min(1040px,100%)!important;padding:10px 10px 92px!important}
.hero,.panel,.card,.historybox,.side,.package,.memory,.setting,.bpanel,.pill,
#historyControls,.hc-card,.conversation,.char,.historyhead,.telegrambar{
  background:var(--rp-glass)!important;
  border:1px solid var(--rp-border)!important;
  backdrop-filter:blur(12px)!important;-webkit-backdrop-filter:blur(12px)!important;
  box-shadow:0 14px 45px rgba(0,0,0,.28)!important;
}
.hero,.panel{border-radius:16px!important}.card,.package,.memory,.setting,.conversation,.char{border-radius:14px!important}
.section-head h2,.brand,.hero h1{background:linear-gradient(90deg,#f8f9ff,#bda7ff,#65e2ff,#f1cfa0);-webkit-background-clip:text;background-clip:text;color:transparent}
.section-head{margin:11px 1px 7px!important}.section-head h2{font-size:16px!important}.section-head p{font-size:10px!important;color:var(--rp-muted)!important}
.hero{padding:16px!important}.hero p,.card p,.char p,.package p,.setting,.memory,.historyhead small{color:var(--rp-muted)!important}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.card{padding:11px!important;min-height:92px!important}
.characters{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
.char{min-width:0!important;overflow:hidden}.char img{height:132px!important}.charbody{padding:8px!important}.charname b{font-size:12px!important}.badge{font-size:8px!important;padding:3px 5px!important}.char p{font-size:9px!important;line-height:1.35!important;margin:5px 0!important;min-height:26px!important}.char .btn{padding:7px 8px!important;font-size:10px!important;border-radius:9px!important}
.history-layout{display:grid!important;grid-template-columns:1fr!important;gap:8px!important}.history-layout>.side{display:block!important;width:100%!important}.historybox{min-height:470px!important;border-radius:15px!important}.historyhead{padding:10px 11px!important;border-radius:15px 15px 0 0!important}.historyhead b{font-size:13px!important;background:linear-gradient(90deg,#fff,#cab9ff,var(--rp-gold2));-webkit-background-clip:text;color:transparent!important}.msg{padding:8px 10px!important;font-size:11px!important;border-radius:12px!important}.historymessages{padding:10px!important;gap:7px!important}
#historyControls{padding:8px!important;border-radius:12px!important}.hc-row{min-height:52px!important;padding:7px!important;border-radius:11px!important;background:rgba(17,24,46,.88)!important;border-color:rgba(255,255,255,.08)!important}.hc-main b{font-size:11px!important}.hc-main small{font-size:8px!important}.hc-actions button{width:25px!important;height:25px!important}
.settings-grid{gap:8px!important}.setting{padding:10px!important}.packages{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.package{padding:11px!important}
.nav{left:50%!important;bottom:20px!important;width:min(640px,calc(100% - 20px))!important;height:58px!important;padding:5px!important;border-radius:18px!important;background:rgba(10,12,22,.78)!important;border:1px solid rgba(255,255,255,.1)!important;backdrop-filter:blur(18px)!important;-webkit-backdrop-filter:blur(18px)!important;transition:bottom .3s cubic-bezier(.22,.61,.36,1),opacity .3s ease!important}
.nav.rp-hidden{bottom:-100px!important;opacity:0!important}
.bonus{width:60px!important;height:60px!important;right:10px!important}

/* Final single character modal */
#rubyPremiumCharacterModal{position:fixed;inset:0;z-index:5000;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,10,.68);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .22s ease}
#rubyPremiumCharacterModal.rp-open{opacity:1;pointer-events:auto}
#rubyPremiumCharacterModal .rp-sheet{width:min(520px,100%);max-height:88vh;overflow:auto;padding:14px;background:linear-gradient(180deg,rgba(18,20,40,.98),rgba(8,10,20,.99));border:1px solid rgba(232,207,138,.22);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -24px 70px rgba(0,0,0,.6),0 0 50px rgba(148,92,255,.12);transform:translateY(32px);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#rubyPremiumCharacterModal.rp-open .rp-sheet{transform:translateY(0)}
#rubyPremiumCharacterModal .rp-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:rgba(7,10,20,.78);color:#fff;font-size:20px}
#rubyPremiumCharacterModal .rp-head{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;padding:3px 2px 10px}
#rubyPremiumCharacterModal .rp-head img{width:104px;height:134px;object-fit:cover;border-radius:16px;border:1px solid rgba(232,207,138,.2)}
#rubyPremiumCharacterModal .rp-name{font-size:22px;font-weight:950;background:linear-gradient(90deg,#fff,var(--rp-gold2),#c9a9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#rubyPremiumCharacterModal .rp-chip{display:inline-flex;margin-top:5px;padding:5px 8px;border-radius:999px;font-size:8px;color:#f4e8ba;border:1px solid rgba(232,207,138,.22);background:rgba(232,207,138,.05)}
#rubyPremiumCharacterModal .rp-personality{margin-top:8px;padding:12px;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.08)}
#rubyPremiumCharacterModal .rp-personality h4{margin:0 0 6px;font-size:11px;color:var(--rp-gold2);letter-spacing:.5px}
#rubyPremiumCharacterModal .rp-personality p{margin:0;color:#cbd2e5;font-size:10px;line-height:1.6;white-space:pre-wrap}
#rubyPremiumCharacterModal .rp-chat{width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1px solid rgba(232,207,138,.32);background:linear-gradient(135deg,#278dff,#6947df 60%,#9e71ff);color:#fff;font-size:12px;font-weight:950;box-shadow:0 10px 28px rgba(70,90,255,.2)}
@media(max-width:600px){#rubyPremiumCharacterModal .rp-sheet{padding:12px;border-radius:20px 20px 0 0}#rubyPremiumCharacterModal .rp-head{grid-template-columns:88px 1fr}#rubyPremiumCharacterModal .rp-head img{width:88px;height:114px}#rubyPremiumCharacterModal .rp-name{font-size:20px}}
</style>
'''
          js = r'''
<script id="ruby-final-premium-js">
(()=>{
  // Remove all previous modal implementations so there is exactly one modal.
  document.querySelectorAll('#characterDetailModal').forEach(el=>el.remove());
  document.querySelectorAll('#rubyPremiumCharacterModal').forEach(el=>el.remove());

  const modal=document.createElement('div');
  modal.id='rubyPremiumCharacterModal';
  modal.innerHTML=`<div class="rp-sheet"><button class="rp-close" type="button" aria-label="Close">×</button><div class="rp-head"><img id="rpImage" alt=""><div><div class="rp-name" id="rpName">Character</div><span class="rp-chip">AI Companion</span></div></div><div class="rp-personality"><h4>Personality &amp; Traits</h4><p id="rpPersonality">—</p></div><button class="rp-chat" type="button">💬 Chat Now</button></div>`;
  document.body.appendChild(modal);

  const close=modal.querySelector('.rp-close'), img=modal.querySelector('#rpImage'), name=modal.querySelector('#rpName'), personality=modal.querySelector('#rpPersonality'), chat=modal.querySelector('.rp-chat');
  let selectedCard=null,selectedData=null;
  const supa=window.supabase?.createClient?.('https://hcbajvladlvhklelbxdr.supabase.co','sb_publishable_eKKXyB0rc7QUwTbdi8Xw_t0n27eIj');
  const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const open=(c,card)=>{selectedCard=card;selectedData=c;img.src=c.image_url||('https://api.dicebear.com/9.x/adventurer/svg?seed='+encodeURIComponent(c.name||'Character'));name.textContent=c.name||'Character';const p=[c.personality,c.speaking_style,c.traits].filter(Boolean).join('\n\n');personality.textContent=p||c.description||'Warm, engaging and private AI companion.';modal.classList.add('rp-open');document.body.style.overflow='hidden'};
  const shut=()=>{modal.classList.remove('rp-open');document.body.style.overflow=''};
  close.addEventListener('click',shut);modal.addEventListener('click',e=>{if(e.target===modal)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
  chat.addEventListener('click',()=>{shut();const btn=selectedCard?.querySelector('.choose');if(btn)btn.click();});

  function bind(){
    document.querySelectorAll('#characterGrid .char').forEach(card=>{
      if(card.dataset.rpBound==='1')return;
      card.dataset.rpBound='1';
      const choose=card.querySelector('.choose');
      if(!choose)return;
      card.addEventListener('click',async e=>{
        e.preventDefault(); e.stopPropagation();
        const id=choose.dataset.id;
        if(!id||!supa)return;
        const q=await supa.from('characters').select('id,name,image_url,description,personality,traits,speaking_style,backstory,scenario').eq('id',id).maybeSingle();
        if(q.data)open(q.data,card);
      },true);
    });
  }
  bind();
  const grid=document.getElementById('characterGrid');if(grid)new MutationObserver(bind).observe(grid,{childList:true,subtree:true});

  // Hide/show the floating dock on scroll direction.
  let last=window.scrollY||0, ticking=false;
  window.addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{const now=window.scrollY||0;const nav=document.querySelector('.nav');if(nav&&Math.abs(now-last)>4)nav.classList.toggle('rp-hidden',now>last&&now>20);last=now;ticking=false})},{passive:true});
})();
</script>
'''

          # Remove prior final-layer tags so this is idempotent.
          s=re.sub(r'<style id="ruby-final-premium-ui">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<script id="ruby-final-premium-js">.*?</script>','',s,flags=re.S)
          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply final premium UI' || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

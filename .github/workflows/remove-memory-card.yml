name: Remove Memory card
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Memory UI cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<article[^>]*id=["\']cardMemory["\'][^>]*>.*?</article>', '', s, flags=re.S|re.I)
          s=re.sub(r'<button[^>]*(?:id=["\']memory["\']|data-view=["\']memory["\'])[^>]*>.*?</button>', '', s, flags=re.S|re.I)
          s=re.sub(r'<div[^>]*class=["\'][^"\']*(?:memory|Memory)[^"\']*["\'][^>]*>.*?</div>', lambda m: '' if 'Memory' in m.group(0) or 'memory' in m.group(0) else m.group(0), s, flags=re.S|re.I)
          p.write_text(s, encoding='utf-8')
          PY
          test -s index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove Memory card from UI' || exit 0
          git push origin HEAD:main

name: One-time history toolbar cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Install one-time history toolbar cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate toolbar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat=r'<div id="historyControls" style="display:none">.*?</div>'
          matches=list(re.finditer(pat,s,re.S))
          if len(matches)>1:
              s=s[:matches[1].start()]+s[matches[1].end():]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Cleanup duplicate history toolbar'
          git push

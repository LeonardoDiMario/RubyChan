name: Fix Ruby Chan index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Supabase initialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          block = '''<script>\nconst SUPABASE_URL = "https://hcbajvladlvhklelbxdr.supabase.co";\n\nconst SUPABASE_PUBLISHABLE_KEY =\n    "sb_publishable_eKKXyB0rc7QUwTbbydi8Xw_t0n27eIj";\n\nconst supabaseClient = supabase.createClient(\n    SUPABASE_URL,\n    SUPABASE_PUBLISHABLE_KEY\n);\n</script>'''
          # Keep the first initialization only; remove later duplicates.
          first = s.find(block)
          if first >= 0:
              rest = s[first + len(block):]
              rest = rest.replace(block, '')
              s = s[:first + len(block)] + rest
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No duplicate Supabase block found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix duplicate Supabase initialization in index"
          git push

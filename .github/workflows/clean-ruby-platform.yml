name: Clean Ruby Chan platform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean and normalize platform markup
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # Remove only generated cleanup fragments before rebuilding them.
          s = re.sub(r'\s*<style id="boot-guard">.*?</style>\s*', '\n', s, flags=re.S)
          s = re.sub(r'\s*/\* Final platform cleanup \*/.*?(?=</style>)', '\n', s, flags=re.S)
          s = re.sub(r'\s*<div class="character-ability"><strong>Ability</strong><br>.*?</div>', '\n', s, flags=re.S)
          s = re.sub(r'\s*<input id="characterSearch"[^>]*>', '\n', s)
          s = re.sub(r'\s*function filterCharacters\(query\)\{.*?\n\}\s*', '\n', s, flags=re.S)

          # One Supabase bootstrap.
          s = re.sub(r'\s*<script src="https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2"></script>\s*', '\n', s)
          supabase_re = re.compile(r'\s*<script>\s*const SUPABASE_URL\s*=\s*"[^"]+";\s*const SUPABASE_PUBLISHABLE_KEY\s*=\s*"[^"]+";\s*const supabaseClient\s*=\s*supabase\.createClient\(\s*SUPABASE_URL,\s*SUPABASE_PUBLISHABLE_KEY\s*\);\s*</script>\s*', re.S)
          s = supabase_re.sub('\n', s)
          bootstrap = '''\n<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script>\nconst SUPABASE_URL = "https://hcbajvladlvhklelbxdr.supabase.co";\nconst SUPABASE_PUBLISHABLE_KEY = "sb_publishable_eKKXyB0rc7QUwTbbydi8Xw_t0n27eIj";\nconst supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);\n</script>\n<style id="boot-guard">html{visibility:hidden}html.app-ready{visibility:visible}</style>\n'''
          s = s.replace('<head>', '<head>' + bootstrap, 1)

          # Polished Quick Access; Chat is the only chat entry point.
          home = '''<section id="page-home" class="page active">\n    <div class="hero">\n        <div class="quick-access">\n            <div class="quick-access-head">\n                <div>\n                    <span class="quick-kicker">QUICK ACCESS</span>\n                    <h2>What do you want to do?</h2>\n                    <p>Jump straight into your characters or continue your Telegram conversations.</p>\n                </div>\n                <div class="quick-orb">✦</div>\n            </div>\n            <div class="quick-grid">\n                <button type="button" class="quick-card quick-characters" onclick="showPage('characters')">\n                    <span class="quick-icon">◉</span>\n                    <span class="quick-title">Characters</span>\n                    <span class="quick-text">Browse, select and discover personality</span>\n                    <span class="quick-arrow">→</span>\n                </button>\n                <button type="button" class="quick-card quick-chat" onclick="showPage('chat');renderChatHistory();">\n                    <span class="quick-icon">💬</span>\n                    <span class="quick-title">Chat</span>\n                    <span class="quick-text">Continue your conversations on Telegram</span>\n                    <span class="quick-arrow">→</span>\n                </button>\n            </div>\n        </div>\n    </div>\n</section>'''
          s, n = re.subn(r'<section id="page-home"\s+class="page active">.*?</section>', home, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('Home section not found')

          css = '''\n/* Ruby Chan final UI */\n.quick-access{margin-top:4px;padding:20px;border-radius:24px;background:linear-gradient(145deg,#ffffff,#f7f4ff);border:1px solid rgba(124,58,237,.12);box-shadow:0 18px 45px rgba(60,40,120,.10);}\n.quick-access-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px;}\n.quick-kicker{font-size:10px;font-weight:800;letter-spacing:1.8px;color:#7c3aed;}\n.quick-access h2{margin:4px 0 5px;font-size:23px;color:#18181b;}\n.quick-access p{font-size:12px;color:#71717a;line-height:1.45;}\n.quick-orb{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:22px;box-shadow:0 10px 22px rgba(124,58,237,.24);}\n.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}\n.quick-card{position:relative;text-align:left;border:1px solid rgba(124,58,237,.10);border-radius:18px;padding:16px;background:white;cursor:pointer;transition:.2s ease;box-shadow:0 8px 20px rgba(0,0,0,.04);}\n.quick-card:hover{transform:translateY(-2px);border-color:rgba(124,58,237,.28);box-shadow:0 12px 28px rgba(60,40,120,.10);}\n.quick-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#f1eaff;color:#7c3aed;font-size:19px;margin-bottom:11px;}\n.quick-title{display:block;font-size:16px;font-weight:800;color:#18181b;}\n.quick-text{display:block;margin-top:4px;padding-right:18px;font-size:11px;color:#71717a;line-height:1.4;}\n.quick-arrow{position:absolute;right:14px;bottom:14px;color:#7c3aed;font-size:18px;}\n.character-card.ruby-selected{border:2px solid #3b82f6 !important;box-shadow:0 0 0 3px rgba(59,130,246,.14),0 8px 24px rgba(59,130,246,.12) !important;}\n.character-card .character-ability{display:none;}\n.character-card.ruby-selected .character-ability{display:block;}\n.character-search{width:100%;margin:10px 0 14px;padding:12px 14px;border:1px solid rgba(124,58,237,.18);border-radius:14px;background:#fff;font-size:15px;outline:none;}\n@media(max-width:520px){.quick-grid{grid-template-columns:1fr;}.quick-access{padding:16px;}.quick-access h2{font-size:20px;}}\n'''
          s = s.replace('</style>', css + '</style>', 1)

          marker = '<p class="section-subtitle">\n        Choose your AI character\n    </p>'
          replacement = marker + '\n\n    <input id="characterSearch" class="character-search" type="search" placeholder="Search characters..." oninput="filterCharacters(this.value)">'
          if marker in s: s = s.replace(marker, replacement, 1)

          abilities = {
            'Sakura':'Warm, playful, gentle and affectionate.', 'Yuna':'Calm, thoughtful and mysterious.', 'Rin':'Quiet, intelligent and composed.', 'Akari':'Energetic, confident and bold.', 'Hana':'Friendly, sweet and romantic.', 'Reina':'Cool, intelligent and composed.', 'Ruby':'Elegant, affectionate and confident.', 'Velvet':'Mysterious, teasing and intelligent.', 'Celeste':'Sweet, dreamy and romantic.', 'Seraphine':'Royal, calm and commanding.'
          }
          for name, ability in abilities.items():
            pattern = rf'(<h3>{re.escape(name)}</h3>\s*<p>.*?</p>)'
            repl = rf'\1<div class="character-ability"><strong>Personality</strong><br>{ability}</div>'
            s = re.sub(pattern, repl, s, count=1, flags=re.S)

          search_js = '''\nfunction filterCharacters(query){const q=(query||'').trim().toLowerCase();document.querySelectorAll('#page-characters .character-card').forEach(card=>{card.style.display=!q||card.textContent.toLowerCase().includes(q)?'':'none';});}\n'''
          s = s.replace('/* =====================================================\n   START\n===================================================== */', search_js + '/* =====================================================\n   START\n===================================================== */', 1)

          # Telegram remains the only Chat destination.
          old_chat = re.compile(r'function addChatToHistory\(character\)\{.*?\n\}\s*function renderChatHistory\(\)\{.*?\n\}\s*function startChat\(character\)\{.*?\n\}', re.S)
          new_chat = '''function addChatToHistory(character){return;}\nfunction renderChatHistory(){const list=document.getElementById('chatHistoryList');if(!list)return;list.innerHTML='<div class="chat-empty" id="chatEmpty">💬<br><span>Your conversations are on Telegram.</span></div>';}\nfunction startChat(character){window.location.href='https://t.me/Rubby_Chan_Bot';}'''
          s, n = old_chat.subn(new_chat, s, count=1)

          s = re.sub(r'\s*document\.documentElement\.classList\.add\("app-ready"\);', '', s)
          s = s.replace('        renderChatHistory();\n\n    }', '        renderChatHistory();\n        document.documentElement.classList.add("app-ready");\n\n    }', 1)
          path.write_text(s, encoding='utf-8')

      - name: Commit cleaned index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Polish Quick Access and unify Chat navigation"; git push; fi

name: Fix character image fallback v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install global character image fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="character-image-fallback"' not in s:
              script=r'''<script id="character-image-fallback">(()=>{
              const escName=(v)=>String(v||'Character').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
              const fallback=(name)=>'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffd6ea"/><stop offset="1" stop-color="#d9c9ff"/></linearGradient></defs><rect width="600" height="760" rx="44" fill="url(#g)"/><circle cx="300" cy="270" r="120" fill="#fff" fill-opacity=".86"/><circle cx="255" cy="255" r="12" fill="#7d5372"/><circle cx="345" cy="255" r="12" fill="#7d5372"/><path d="M245 320 Q300 360 355 320" fill="none" stroke="#9b5f82" stroke-width="10" stroke-linecap="round"/><text x="300" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#7d5372">'+escName(name)+'</text></svg>');
              document.addEventListener('error',e=>{
                const img=e.target;
                if(!(img instanceof HTMLImageElement) || !img.closest('#characterGrid')) return;
                if(img.dataset.fallbackApplied==='1') return;
                img.dataset.fallbackApplied='1';
                img.src=fallback(img.alt||'Character');
              },true);
              window.addEventListener('load',()=>document.querySelectorAll('#characterGrid img').forEach(img=>{if(!img.complete||img.naturalWidth===0){img.dataset.fallbackApplied='1';img.src=fallback(img.alt||'Character')}}));
              })();</script>'''
              s=s.replace('</body>',script+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I))
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); path=f.name
          r=subprocess.run(['node','--check',path],capture_output=True,text=True)
          print(r.stderr)
          sys.exit(r.returncode)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add robust character image fallback' || exit 0
          git push origin HEAD:main

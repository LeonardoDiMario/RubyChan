name: Fix bonus and delete UI
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.bpanel{position:fixed;right:12px;top:calc(45% + 38px);width:min(300px,calc(100vw - 68px));padding:12px;border-radius:18px;z-index:61}'
          new = '.bpanel{position:fixed;right:12px;top:calc(45% + 38px);width:min(300px,calc(100vw - 68px));padding:12px;border-radius:18px;z-index:61;display:none;pointer-events:none}.bpanel.open{display:block;pointer-events:auto}'
          if old in s:
              s = s.replace(old, new, 1)
          elif 'display:none;pointer-events:none}.bpanel.open' not in s:
              raise SystemExit('bonus panel selector not found')
          modal_css = '.hc-modal{position:fixed;inset:0;display:none!important;align-items:center;justify-content:center;padding:18px;background:rgba(111,57,90,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:5000;pointer-events:none}.hc-modal.open{display:flex!important;pointer-events:auto}.hc-card{width:min(340px,calc(100vw - 32px));padding:16px;border:1px solid rgba(255,255,255,.9);border-radius:20px;background:rgba(255,247,252,.94);box-shadow:0 28px 70px rgba(128,65,101,.24);color:#714e65}.hc-card h3{margin:0 0 6px;font-size:15px;color:#9e4f79}.hc-card p{margin:0;color:#947488;font-size:10px;line-height:1.5}.hc-card .row{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}.hc-card .hbtn{border:1px solid rgba(255,111,174,.15);border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.75);color:#8d5877;font-weight:850;font-size:9px}.hc-card .hbtn.danger{background:linear-gradient(135deg,#ff78b2,#b083ff);color:#fff;border:0}'
          if '.hc-modal{position:fixed' not in s:
              s = s.replace('</style>\n\n</head><body>', modal_css + '\n</style>\n\n</head><body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix bonus panel click and delete modal layout' || exit 0
          git push origin HEAD:main

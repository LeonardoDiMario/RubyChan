name: Remove choose conversation placeholder
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Remove choose conversation placeholder applied'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove placeholder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="msg ai">Choose a conversation to read its history.</div>'
          s = s.replace(old, '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove choose conversation placeholder applied' || exit 0
          git push

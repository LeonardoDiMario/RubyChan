name: Final settings and history UI overhaul
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  overhaul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine History block and rebuild Settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          soup = BeautifulSoup(s, 'html.parser')

          # Remove the large history presentation block and its Telegram CTA/header,
          # while retaining the actual conversation list and message history area.
          chat = soup.find(id='chat')
          if chat:
              hb = chat.select_one('.historybox')
              if hb:
                  hb.decompose()
              # Keep the conversation list; make the side panel compact and title-free.
              side = chat.select_one('.side')
              if side:
                  h3 = side.find('h3')
                  if h3:
                      h3.decompose()
                  side['class'] = (side.get('class') or []) + ['history-list-only']

          # Rebuild Settings UI while preserving existing IDs used by the Supabase save logic.
          settings = soup.find(id='settings')
          if settings:
              settings.clear()
              settings.append(BeautifulSoup('''
              <div class="panel settings-panel">
                <div class="section-head"><h2>Settings</h2><p>Customize your Ruby Chan experience</p></div>
                <div class="settings-plan">
                  <div><span class="settings-kicker">YOUR PLAN</span><strong>Free</strong><small>Upgrade when you need more Energy & Gems.</small></div>
                  <button class="btn primary" id="settingsUpgrade" type="button">View Recharge</button>
                </div>
                <div class="settings-grid settings-main-grid">
                  <div class="setting"><label>Language<select class="select" id="language"><option value="en">English</option><option value="my">မြန်မာ</option></select></label></div>
                  <div class="setting"><label>Notifications<button class="switch on" id="notif" type="button"><i></i></button></label><small>App and reward notices</small></div>
                  <div class="setting"><label>Offers<button class="switch on" id="offers" type="button"><i></i></button></label><small>Premium and recharge offers</small></div>
                  <div class="setting"><label>Background<select class="select" id="bgmode"><option value="midnight">Midnight Blue</option><option value="violet">Violet Night</option><option value="ocean">Deep Ocean</option></select></label></div>
                </div>
                <div class="settings-subtitle">Chat Preferences</div>
                <div class="settings-grid settings-main-grid">
                  <div class="setting"><label>Compact bubbles<button class="switch on" id="compactMode" type="button"><i></i></button></label><small>Keep chat cards tight and clean</small></div>
                  <div class="setting"><label>Animations<button class="switch on" id="motionMode" type="button"><i></i></button></label><small>Bubble and modal transitions</small></div>
                </div>
                <div class="settings-subtitle">History & Safety</div>
                <div class="settings-note"><b>Auto-delete</b><span>Unpinned conversations are removed after 7 days. Pinned conversations are kept.</span></div>
                <div class="settings-note"><b>Telegram Sync</b><span>Chat history is read-only here and synced from Telegram.</span></div>
                <div class="settings-actions"><button class="btn primary" id="saveSettings" type="button">Save settings</button></div>
              </div>
              ''', 'html.parser'))

          # Remove obsolete Memory navigation/handlers that can crash the main script.
          js = str(soup)
          js = js.replace("nav('navMemory','memory');", '')
          js = js.replace("nav('navChat','chat');", "nav('navChat','chat');")
          js = re.sub(r"\$('cardMemory'\)\.addEventListener\([^;]+;", '', js)
          js = js.replace("'memory',", '')
          js = js.replace(",memory", '')
          # Remove direct element handlers for deleted memory controls if present.
          js = re.sub(r"\$\('(saveMemory|memoryInput|memoryList)'\)[^;]*;", '', js)

          # Add robust UI-only settings interactions. Existing saveSettings/remote fields remain authoritative.
          script = '''<script id="ruby-settings-enhance">(()=>{\nconst $=id=>document.getElementById(id);\n$('settingsUpgrade')?.addEventListener('click',()=>{document.getElementById('navRecharge')?.click();const r=document.getElementById('cardRecharge');if(r)r.click();else window.scrollTo(0,0)});\nfor(const id of ['compactMode','motionMode']){const el=$(id);if(!el)continue;const key='ruby_'+id;el.classList.toggle('on',localStorage.getItem(key)!=='0');el.addEventListener('click',()=>{el.classList.toggle('on');localStorage.setItem(key,el.classList.contains('on')?'1':'0')})}\nconst bg=$('bgmode');if(bg){const old=localStorage.getItem('ruby_bgmode');if(old)bg.value=old;bg.addEventListener('change',()=>localStorage.setItem('ruby_bgmode',bg.value))}\nconst motion=localStorage.getItem('ruby_motionMode');if(motion==='0'){document.documentElement.classList.add('reduce-motion')}\n})();</script>'''
          body = soup.body
          body.append(BeautifulSoup(script,'html.parser'))

          # Premium compact styling for the rebuilt Settings and History list.
          css = '''<style id="ruby-settings-history-style">\n.history-list-only{width:100%!important;display:block!important;padding:0!important;border:0!important;background:transparent!important;box-shadow:none!important}.history-list-only .hc-row,.history-list-only .conversation{background:rgba(255,255,255,.52)!important;border:1px solid rgba(220,145,186,.28)!important;color:#704c62!important}.settings-panel{background:rgba(255,255,255,.42)!important;border:1px solid rgba(255,255,255,.75)!important;box-shadow:0 16px 40px rgba(194,112,157,.12)!important}.settings-plan{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(250,223,238,.72));border:1px solid rgba(218,145,187,.25);margin-bottom:12px}.settings-kicker{display:block;font-size:9px;letter-spacing:1.5px;color:#b46a91;font-weight:900}.settings-plan strong{display:block;font-size:22px;color:#824d68}.settings-plan small,.setting small{color:#9b788b;font-size:10px}.settings-subtitle{margin:14px 2px 7px;font-size:11px;font-weight:900;color:#9d5b80;letter-spacing:.4px}.setting{background:rgba(255,255,255,.5)!important;border:1px solid rgba(223,163,195,.24)!important}.settings-note{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;margin-top:8px;border-radius:13px;background:rgba(255,255,255,.44);border:1px solid rgba(223,163,195,.22);font-size:10px;color:#8e6d7e}.settings-note b{color:#7e5068;white-space:nowrap}.settings-actions{margin-top:12px}.reduce-motion *{animation:none!important;transition:none!important}@media(max-width:600px){.settings-plan{align-items:flex-start;flex-direction:column}.settings-plan .btn{width:100%}}\n</style>'''
          soup.head.append(BeautifulSoup(css,'html.parser'))

          p.write_text(str(soup), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine history block and restore complete settings UI' || exit 0
          git push origin HEAD:main

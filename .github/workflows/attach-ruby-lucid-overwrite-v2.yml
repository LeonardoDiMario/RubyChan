name: Attach Ruby Lucid overwrite v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach assets and push latest main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link id="ruby-lucid-overwrite-css" rel="stylesheet" href="ruby-lucid-overwrite.css">'
          js='<script id="ruby-lucid-overwrite-js" src="ruby-lucid-overwrite.js"></script>'
          if 'id="ruby-lucid-overwrite-css"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          if 'id="ruby-lucid-overwrite-js"' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check ruby-lucid-overwrite.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'attach Ruby Lucid overwrite assets'
          git pull --rebase origin main
          git push origin HEAD:main

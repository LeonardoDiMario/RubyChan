name: Final index overwrite
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  overwrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified index
        env:
          INDEX_B64: ' 
          python3 - <<'PY'
          import base64,gzip,os
          from pathlib import Path
          Path('index.html').write_bytes(gzip.decompress(base64.b64decode(os.environ['INDEX_B64'])))
          PY
          rm -f .github/workflows/compact-premium-v*.yml .github/workflows/final-premium-ui.yml .github/workflows/overwrite-premium-ui.yml .github/workflows/personality-modal-*.yml .github/workflows/rp-ui-apply.yml .github/workflows/fix-bonus-delete-ui*.yml .github/workflows/fix-history-*.yml .github/workflows/cleanup-history-toolbar.yml
      - name: Commit and force final main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows
          git commit -m 'Install verified Ruby Chan UI build' || true
          git push --force origin HEAD:main

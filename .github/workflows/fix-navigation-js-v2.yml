name: Fix navigation JS v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean remaining broken JS fragments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove the orphan tail of the deleted Telegram CTA handler.
          s=re.sub(r"if\(tg\?\.openTelegramLink\)tg\.openTelegramLink\(u\);else window\.open\(u,'_blank'\)\}\);", '', s, count=1)

          # Replace openHistory with a clean implementation and remove any stale Memory deletion code.
          clean_open = """async function openHistory(id){const c=convs.find(x=>x.id===id);if(!c)return;const r=await sb.from('messages').select('role,content').eq('conversation_id',id).eq('user_id',profile.id).order('created_at');$('historyMessages').innerHTML=(r.data||[]).map(m=>`<div class=\"msg ${m.role==='user'?'user':'ai'}\">${esc(m.content)}</div>`).join('')||'<div class=\"msg ai\">No messages yet.</div>';document.querySelectorAll('.conversation').forEach(x=>x.classList.toggle('active',x.dataset.id===id))}async function loadSettings"""
          s2,n=re.subn(r"async function openHistory\(id\)\{[\s\S]*?async function loadSettings", clean_open, s, count=1)
          if n!=1: raise SystemExit('openHistory block not found')
          s=s2

          # Remove any remaining direct references to deleted Memory controls.
          s=re.sub(r"\$\('(saveMemory|memoryInput|memoryList)'\)[^;]*;", '', s)
          s=re.sub(r"document\.querySelectorAll\('\.del'\)[^;]*;", '', s)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I))
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); path=f.name
          r=subprocess.run(['node','--check',path],capture_output=True,text=True)
          print(r.stderr)
          sys.exit(r.returncode)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix remaining navigation JavaScript fragments' || exit 0
          git push origin HEAD:main

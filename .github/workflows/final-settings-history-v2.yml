name: Final settings and history cleanup v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch History and Settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Keep the actual history/messages but remove the large heading/header
          # and Telegram CTA block that the user does not want.
          s=re.sub(r'<div class="historyhead">.*?</div>\s*', '', s, count=1, flags=re.S)
          s=re.sub(r'<div class="telegrambar">.*?</div>\s*', '', s, count=1, flags=re.S)

          # Rebuild the Settings page with the complete set of useful controls,
          # preserving existing Supabase-backed IDs.
          settings=re.search(r'<section id="settings" class="view">.*?</section>', s, flags=re.S)
          if settings:
              new_settings='''<section id="settings" class="view"><div class="panel settings-panel"><div class="section-head"><h2>Settings</h2><p>Customize your Ruby Chan experience</p></div><div class="settings-plan"><div><span class="settings-kicker">YOUR PLAN</span><strong>Free</strong><small>Recharge Energy & Gems when you need more.</small></div><button class="btn primary" id="settingsUpgrade" type="button">View Recharge</button></div><div class="settings-subtitle">General</div><div class="settings-grid settings-main-grid"><div class="setting"><label>Language<select class="select" id="language"><option value="en">English</option><option value="my">မြန်မာ</option></select></label></div><div class="setting"><label>Background<select class="select" id="bgmode"><option value="midnight">Midnight Blue</option><option value="violet">Violet Night</option><option value="ocean">Deep Ocean</option></select></label></div></div><div class="settings-subtitle">Notifications</div><div class="settings-grid settings-main-grid"><div class="setting"><label>Notifications<button class="switch on" id="notif" type="button"><i></i></button></label><small>Daily rewards and app notices</small></div><div class="setting"><label>Offers<button class="switch on" id="offers" type="button"><i></i></button></label><small>Premium and recharge offers</small></div></div><div class="settings-subtitle">Chat Preferences</div><div class="settings-grid settings-main-grid"><div class="setting"><label>Compact bubbles<button class="switch on" id="compactMode" type="button"><i></i></button></label><small>Keep cards and chat bubbles compact</small></div><div class="setting"><label>Animations<button class="switch on" id="motionMode" type="button"><i></i></button></label><small>Bubble and modal transitions</small></div></div><div class="settings-subtitle">History & Safety</div><div class="settings-note"><b>Auto-delete</b><span>Unpinned chats auto-delete after 7 days; pinned chats stay.</span></div><div class="settings-note"><b>Telegram Sync</b><span>History here is read-only and synced from Telegram.</span></div><div class="settings-actions"><button class="btn primary" id="saveSettings" type="button">Save settings</button></div></div></section>'''
              s=s[:settings.start()]+new_settings+s[settings.end():]

          # Remove Memory navigation/card handlers that can crash JS now that the page is gone.
          s=s.replace("nav('navMemory','memory');", '')
          s=s.replace("$('cardMemory').addEventListener('click',()=>show('memory'));", '')
          s=s.replace("$('saveMemory').addEventListener", "nullSaveMemory.addEventListener")
          s=s.replace("const views=['home','characters','chat','memory','recharge','settings'];", "const views=['home','characters','chat','recharge','settings'];")

          # Remove stale direct references that would otherwise run against deleted Memory DOM nodes.
          s=re.sub(r"\$\('memoryInput'\)[^;]*;", '', s)
          s=re.sub(r"\$\('memoryList'\)[^;]*;", '', s)
          s=re.sub(r"async function loadMemories\(\).*?\n\s*\}\$\('nullSaveMemory'", "async function loadMemories(){return}\n$('nullSaveMemory'", s, flags=re.S)
          s=s.replace("nav('navChat','chat');", "nav('navChat','chat');")

          # Compact, cute styling consistent with the existing pink bubble UI.
          style='''<style id="ruby-settings-history-v2">.historyhead,.telegrambar{display:none!important}.historybox{border:0!important;background:transparent!important;box-shadow:none!important;min-height:0!important}.settings-panel{background:rgba(255,255,255,.44)!important;border:1px solid rgba(255,255,255,.78)!important;box-shadow:0 16px 42px rgba(194,112,157,.14)!important}.settings-plan{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(250,222,237,.76));border:1px solid rgba(218,145,187,.25);margin-bottom:12px}.settings-kicker{display:block;font-size:9px;letter-spacing:1.4px;color:#b46a91;font-weight:900}.settings-plan strong{display:block;font-size:22px;color:#824d68}.settings-plan small,.setting small{display:block;color:#9b788b;font-size:10px;margin-top:4px}.settings-subtitle{margin:14px 2px 7px;font-size:11px;font-weight:900;color:#9d5b80}.setting{background:rgba(255,255,255,.52)!important;border:1px solid rgba(223,163,195,.24)!important}.settings-note{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;margin-top:8px;border-radius:13px;background:rgba(255,255,255,.46);border:1px solid rgba(223,163,195,.22);font-size:10px;color:#8e6d7e}.settings-note b{color:#7e5068;white-space:nowrap}.settings-actions{margin-top:12px}@media(max-width:600px){.settings-plan{align-items:flex-start;flex-direction:column}.settings-plan .btn{width:100%}} </style>'''
          s=s.replace('</head>', style+'\n</head>', 1)

          # UI-only settings extras; existing saveSettings still handles Supabase fields.
          extra='''<script id="ruby-settings-v2">(()=>{const q=id=>document.getElementById(id);q('settingsUpgrade')?.addEventListener('click',()=>q('cardRecharge')?.click());for(const id of ['compactMode','motionMode']){const e=q(id);if(!e)continue;const k='ruby_'+id;e.classList.toggle('on',localStorage.getItem(k)!=='0');e.addEventListener('click',()=>{e.classList.toggle('on');localStorage.setItem(k,e.classList.contains('on')?'1':'0')})}const bg=q('bgmode');if(bg){const v=localStorage.getItem('ruby_bgmode');if(v)bg.value=v;bg.addEventListener('change',()=>localStorage.setItem('ruby_bgmode',bg.value))}})();</script>'''
          s=s.replace('</body>', extra+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'id="settings"' index.html
          grep -q 'id="language"' index.html
          grep -q 'id="notif"' index.html
          grep -q 'id="offers"' index.html
          grep -q 'id="bgmode"' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Finish History cleanup and restore full Settings UI' || exit 0
          git push origin HEAD:main

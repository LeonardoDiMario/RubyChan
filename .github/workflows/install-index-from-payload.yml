name: Install verified index
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install index.html
        run: |
          base64 -d rubychan_index_upload.gz.b64 | gzip -dc > index.html
          test -s index.html
          grep -q 'Daily Bonus' index.html
          grep -q 'bpanel' index.html
          grep -q 'hc-modal' index.html
      - name: Commit final index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f rubychan_index_upload.gz.b64 .github/workflows/install-index-from-payload.yml || true
          git commit -m 'Install cute Ruby Chan UI and fix bonus modal layout' || exit 0
          git push --force origin HEAD:main

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucid Dream AI</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #090514, #140d2b);
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 26px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .header p {
            font-size: 13px;
            color: #8b85a3;
            margin: 5px 0 0 0;
        }

        /* ဇာတ်ကောင် Card များ ပြသမည့်နေရာ */
        .character-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 450px;
        }

        .char-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .char-card:hover {
            transform: translateY(-5px);
            border-color: #ff416c;
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.3);
        }

        /* ဇာတ်ကောင် ပုံနေရာ (လောလောဆယ် Emoji သုံးထားသည်) */
        .char-img {
            height: 140px;
            background: #251845;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .char-info {
            padding: 12px;
        }

        .char-name {
            font-size: 16px;
            font-weight: bold;
            color: #f1f0f5;
        }

        .char-tag {
            font-size: 11px;
            color: #ff416c;
            background: rgba(255, 65, 108, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 5px;
        }

        /* ကန့်သတ်ချက် သတိပေးချက် */
        .footer-text {
            margin-top: 30px;
            font-size: 11px;
            color: #56506d;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>LUCID DREAM AI</h1>
        <p>စကားပြောလိုသည့် AI ဇာတ်ကောင်ကို ရွေးချယ်ပါ</p>
    </div>

    <!-- ဇာတ်ကောင်များ စာရင်း -->
    <div class="character-container">
        
        <!-- ဇာတ်ကောင် ၁ -->
        <div class="char-card" onclick="selectCharacter('Sakura', 'Anime Student')">
            <div class="char-img">🌸</div>
            <div class="char-info">
                <div class="char-name">Sakura</div>
                <div class="char-tag">18+ Tsundere</div>
            </div>
        </div>

        <!-- ဇာတ်ကောင် ၂ -->
        <div class="char-card" onclick="selectCharacter('Elena', 'Vampire Queen')">
            <div class="char-img">🧛‍♀️</div>
            <div class="char-info">
                <div class="char-name">Elena</div>
                <div class="char-tag">18+ Dominant</div>
            </div>
        </div>

        <!-- ဇာတ်ကောင် ၃ -->
        <div class="char-card" onclick="selectCharacter('Alpha', 'Cyber Bodyguard')">
            <div class="char-img">🤖</div>
            <div class="char-info">
                <div class="char-name">Alpha</div>
                <div class="char-tag">18+ Cool Guy</div>
            </div>
        </div>

        <!-- ဇာတ်ကောင် ၄ -->
        <div class="char-card" onclick="selectCharacter('Lisa', 'Office Secretary')">
            <div class="char-img">💼</div>
            <div class="char-info">
                <div class="char-name">Lisa</div>
                <div class="char-tag">18+ Romance</div>
            </div>
        </div>

    </div>

    <div class="footer-text">
        This app contains 18+ adult content. Strictly for users over 18.
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ဇာတ်ကောင်တစ်ခုခုကို နှိပ်လိုက်လျှင် လုပ်ဆောင်မည့်အလုပ်
        function selectCharacter(name, type) {
            // Telegram Bot Chat ထဲသို့ ဇာတ်ကောင်နာမည်ကို လှမ်းပို့လိုက်ခြင်း
            tg.sendData(JSON.stringify({
                action: "start_chat",
                character_name: name,
                character_type: type
            }));
            
            // App ကို ပိတ်လိုက်မည်
            tg.close();
        }
    </script>
</body>
</html>

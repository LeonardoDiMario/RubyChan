<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ruby Chan V2</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;background:#f6f3fb;color:#17151c}body{display:flex;justify-content:center}.app{width:min(1180px,100%);min-height:100vh;padding:28px 22px 120px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.brand{font-size:24px;font-weight:800;color:#7c3aed}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#fff,#eadcff);display:grid;place-items:center}.hero{padding:34px;border-radius:30px;background:linear-gradient(145deg,#fff,#f3ecff);box-shadow:0 20px 55px #4c2b7814}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;color:#8b5cf6}.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-2.5px;margin:10px 0}.hero p{max-width:620px;color:#706a78;font-size:15px;line-height:1.6}.continue{margin-top:20px;border:0;border-radius:16px;padding:14px 22px;background:#7c3aed;color:white;font-weight:750}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.card{min-height:160px;padding:22px;border-radius:24px;background:#ffffffc9;box-shadow:0 14px 35px #3c287012}.icon{font-size:25px}.card h3{margin:18px 0 6px}.card p{margin:0;color:#77717f;font-size:13px}.nav{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(560px,calc(100% - 28px));height:72px;padding:7px;border-radius:24px;background:#fffffff0;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 16px 50px #3d23651f;display:flex;gap:6px}.nav button{flex:1;border:0;border-radius:18px;background:transparent;color:#827a8d;font:inherit;font-size:11px;font-weight:700}.nav button.active{background:#f0e7ff;color:#7c3aed}.na
